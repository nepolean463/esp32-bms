[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
upload_speed = 921600
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
